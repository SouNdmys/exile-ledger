[package]
name = "pnd-app"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "POE Ninja Data GPUI desktop front end"
default-run = "pnd-app"

[lib]
name = "pnd_app"
path = "src/lib.rs"

[[bin]]
name = "pnd-app"
path = "src/main.rs"

[dependencies]
gpui.workspace = true
gpui-component.workspace = true
pnd-domain = { path = "../pnd-domain" }
pnd-trade = { path = "../pnd-trade" }
pnd-ninja = { path = "../pnd-ninja" }
pnd-storage = { path = "../pnd-storage" }
pnd-settings = { path = "../pnd-settings" }
pnd-runtime = { path = "../pnd-runtime" }
pnd-platform-win = { path = "../pnd-platform-win" }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
# 只为一件事:从 gpui 的 `Window` 里把 Win32 的 HWND 掏出来(托盘要知道
# 藏的是哪一个窗口)。版本必须和 gpui 用的那条一致,否则 `HasWindowHandle`
# 会变成两个互不认识的同名 trait。
raw-window-handle = "0.6"

# build.rs 把 assets/icon.ico 编进 exe 的资源段。故意不放在
# target.'cfg(windows)' 下面:build-dependencies 的 target cfg 是按目标平台判定
# 的,跨编译到非 Windows 时它会把依赖抽掉、却留下 build.rs 里对它的引用,反而编
# 不过。所以照单收下,由 build.rs 自己看 CARGO_CFG_TARGET_OS 决定干不干活。
[build-dependencies]
winresource = "0.1"
